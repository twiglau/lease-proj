server:
  port: 8080

spring:
  application:
    name: lease
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://127.0.0.1:3306/lease?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2d8
    username: root
    password: Lzy1990052812@
    hikari:
      connection-test-query: SELECT 1 # 自动检测连接
      connection-timeout: 60000 # 数据库连接超时时间， 默认30s
      idle-timeout: 500000 # 空闲连接存活最大时间，默认600_000(10分钟)
      max-lifetime: 540000 # 连接的最长生命周期，值0表示无限生命周期，默认1800_000(30分钟)
      maximum-pool-size: 12 # 连接池最大连接数，默认是 10
      minimum-idle: 10 # 最小空闲连接数量
      pool-name: SPH_HikariPool # 连接池名称
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2 # 基线版本本身会被当作「已执行」，比它大的版本才会执行
    validate-on-migrate: true
    clean-disabled: true

springdoc:
  default-flat-param-object: true # 用于测试时将queryVo做打平处理

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: flag # 全局逻辑删除的实体字段名(配置后可以忽略不配置步骤...) @TableLogic 同样的效果
      logic-delete-value: 1 # 逻辑已删除值(默认为1)
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    root: info

minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: lease
