server:
  port: 8081

# springdoc-openapi 配置（knife4j starter 已内置该依赖，无需重复引入）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: default
      packages-to-scan: org.twiglau.helloknife4j.controller

# knife4j 增强配置（enable: true 启用 UI 增强，language: zh_cn 中文界面）
knife4j:
  enable: true
  setting:
    language: zh_cn
